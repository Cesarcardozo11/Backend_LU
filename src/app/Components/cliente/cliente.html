<mat-card class="cliente-card">
  <mat-card-header class="cliente-header">
    <div mat-card-avatar class="cliente-avatar" aria-hidden="true">{{ iniciales() }}</div>
    <mat-card-title>{{ cliente().nombre }}</mat-card-title>
    <mat-card-subtitle>{{ cliente().ciudad }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <dl class="cliente-datos">
      <div class="dato">
        <dt>Correo</dt>
        <dd>
          <a [href]="'mailto:' + cliente().email">{{ cliente().email }}</a>
        </dd>
      </div>

      <div class="dato">
        <dt>Teléfono</dt>
        <dd>
          <a [href]="telefonoEnlace()">{{ cliente().telefono }}</a>
        </dd>
      </div>

      <div class="dato">
        <dt>Compras</dt>
        <dd>{{ cliente().compras }}</dd>
      </div>
    </dl>
  </mat-card-content>

  <mat-card-actions align="end">
    <button matButton type="button" (click)="seleccionar.emit(cliente())">Ver compras</button>
  </mat-card-actions>
</mat-card>
