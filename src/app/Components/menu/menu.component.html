@let isHandset = this.isHandset();

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="isHandset ? 'dialog' : 'navigation'"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="isHandset === false"
  >
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list> 
      <a mat-list-item routerLink="/Clientes">Clientes</a>
      <a mat-list-item routerLink="/Inventario">Inventario</a>
      <a mat-list-item routerLink="/form">Agregar a Inventario</a>
      <a mat-list-item routerLink="/Compras">Compras</a>
      
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar style="background-color: rgb(255, 193, 246);">
      @if (isHandset) {
        <button type="button" aria-label="Toggle sidenav" matIconButton (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span>Lulosa.</span>
      <button type="button" matButton style="margin-left: auto" (click)="cerrarSesion()">Cerrar sesión</button>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
